apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: digital-bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
        - name: account-service
          image: savindugunasekara/digital-bank-account-service:latest
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "4002"
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@host.docker.internal:5433/digital_bank_account?schema=public"
            - name: JWT_SECRET
              value: "supersecret_change_me"
          ports:
            - containerPort: 4002
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: digital-bank
spec:
  type: ClusterIP
  selector:
    app: account-service
  ports:
    - name: http
      port: 4002
      targetPort: 4002
