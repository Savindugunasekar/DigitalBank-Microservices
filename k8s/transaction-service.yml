apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: digital-bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
        - name: transaction-service
          image: savindugunasekara/digital-bank-transaction-service:latest
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "4003"
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres.digital-bank.svc.cluster.local:5432/digital_bank_transaction?schema=public"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:4001"
            - name: ACCOUNT_SERVICE_URL
              value: "http://account-service:4002"
            - name: FRAUD_SERVICE_URL
              value: "http://fraud-service:4004"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:4005"
            - name: JWT_SECRET
              value: "supersecret_change_me"
          ports:
            - containerPort: 4003
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: digital-bank
spec:
  type: ClusterIP
  selector:
    app: transaction-service
  ports:
    - name: http
      port: 4003
      targetPort: 4003
