apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: digital-bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: digital-banking-platform-notification-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "4005"
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@db:5432/digital_bank_notification?schema=public"
            - name: JWT_SECRET
              value: "supersecret_change_me"
          ports:
            - containerPort: 4005
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: digital-bank
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 4005
      targetPort: 4005
