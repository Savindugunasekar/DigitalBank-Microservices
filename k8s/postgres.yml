apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: digital-bank
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432        # inside cluster
      targetPort: 5432  # container port

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: digital-bank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: digital-bank-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: digital-bank-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: digital_bank_auth
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          emptyDir: {} # dev only - ephemeral; later we’ll switch to PVC for persistence
