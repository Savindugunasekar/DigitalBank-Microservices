apiVersion: v1
kind: Service
metadata:
  name: admin-frontend
  namespace: digital-bank
spec:
  type: ClusterIP
  selector:
    app: admin-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: customer-frontend
  namespace: digital-bank
spec:
  type: ClusterIP
  selector:
    app: customer-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
